name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main", "backend" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Continuous Integration (Linter & Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar uv (Package Manager)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Instalar dependencias
        run: |
          uv sync --all-groups

      - name: Ejecutar linter (Ruff)
        run: |
          uv run ruff check app

      - name: Ejecutar pruebas automatizadas (Pytest)
        run: |
          uv run pytest tests/test_common.py tests/test_errors.py tests/test_health.py tests/test_email_service.py tests/test_services.py -v

  deploy:
    name: Continuous Deployment (Render)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/backend')

    steps:
      - name: Disparar Deploy Hook de Render
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "::warning ::RENDER_DEPLOY_HOOK no está configurado en GitHub Secrets aún. Saltando despliegue automático."
          else
            echo "Disparando despliegue en Render..."
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" --fail
            echo "Despliegue solicitado exitosamente a Render."
          fi
